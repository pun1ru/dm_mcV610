project:
  packs:
    - pack: ARM::CMSIS@^5.9.0
    - pack: Keil::STM32H7xx_DFP@^4.1.3
    - pack: ARM::CMSIS-NN@^4.0.0
    - pack: ARM::CMSIS-DSP@^1.10.1
  setups:
    - setup: Options for dm_mcV610
      processor:
        fpu: dp
      add-path:
        - ../Core/Inc
        - ../LibSE/BSP/CAN
        - ../LibSE/BSP/PWM
        - ../LibSE/BSP/UART
        - ../LibSE/BSP/DWT
        - ../LibSE/Drivers/Buzzer
        - ../LibSE/Drivers/Bmi088
        - ../LibSE/Drivers/Referee
        - ../LibSE/Drivers/RC/DT7
        - ../LibSE/Algorithm/Math
        - ../LibSE/Algorithm/Control/PID
        - ../LibSE/Algorithm/Control/ADRC
        - ../LibSE/Algorithm/Process/kalman_filter
        - ../LibSE/Algorithm/Process/ekf
        - ../LibSE/Algorithm/INS/Madgwick
        - ../LibSE/Module/INS
        - ../LibSE/Module/Monitor
        - ../LibSE/Task
        - ../LibSE/Task/Inc
        - ../Drivers/STM32H7xx_HAL_Driver/Inc
        - ../Drivers/STM32H7xx_HAL_Driver/Inc/Legacy
        - ../Drivers/CMSIS/Device/ST/STM32H7xx/Include
        - ../Drivers/CMSIS/Include
        - ../USB_DEVICE/App
        - ../USB_DEVICE/Target
        - ../Middlewares/Third_Party/FreeRTOS/Source/include
        - ../Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS
        - ../Middlewares/Third_Party/FreeRTOS/Source/portable/RVDS/ARM_CM4F
        - ../Middlewares/ST/STM32_USB_Device_Library/Core/Inc
        - ../Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
      debug: "on"
      define:
        - USE_HAL_DRIVER
        - STM32H723xx
      misc:
        - C:
            - -std=c99
          C-CPP:
            - -fno-rtti
            - -funsigned-char
            - -fshort-enums
            - -fshort-wchar
            - -ffunction-sections
            - -Wno-packed
            - -Wno-missing-variable-declarations
            - -Wno-missing-prototypes
            - -Wno-missing-noreturn
            - -Wno-sign-conversion
            - -Wno-nonportable-include-path
            - -Wno-reserved-id-macro
            - -Wno-unused-macros
            - -Wno-documentation-unknown-command
            - -Wno-documentation
            - -Wno-license-management
            - -Wno-parentheses-equality
          CPP:
            - -xc++
            - -std=c++03
            - -fno-exceptions
          ASM:
            - -masm=auto
          Link:
            - --map
            - --load_addr_map_info
            - --xref
            - --callgraph
            - --symbols
            - --info sizes
            - --info totals
            - --info unused
            - --info veneers
            - --strict
            - --summary_stderr
            - --info summarysizes
  linker:
    - script: dm_mcV610_dm_mcV610.sct
  groups:
    - group: Application/MDK-ARM
      files:
        - file: startup_stm32h723xx.s
    - group: LibSE/BSP/CAN
      files:
        - file: ../LibSE/BSP/CAN/CAN_driver.c
    - group: LibSE/BSP/PWM
      files:
        - file: ../LibSE/BSP/PWM/bsp_pwm.c
    - group: LibSE/BSP/UART
      files:
        - file: ../LibSE/BSP/UART/bsp_uart.c
    - group: LibSE/BSP/DWT
      files:
        - file: ../LibSE/BSP/DWT/bsp_dwt.c
    - group: LibSE/Drivers/Buzzer
      files:
        - file: ../LibSE/Drivers/Buzzer/bsp_buzzer.c
    - group: LibSE/Drivers/Bmi088
      files:
        - file: ../LibSE/Drivers/Bmi088/bmi088_driver.c
        - file: ../LibSE/Drivers/Bmi088/bmi088_middleware.c
    - group: LibSE/Drivers/Referee
